<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AKS Exam Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AKS Exam Quiz — Azure DevOps, AKS & Terraform</h1>
    <p>Multiple choice and text-input quiz. Host this folder on GitHub Pages.</p>
  </header>

  <main id="main">
    <div id="quiz"></div>
    <div class="actions">
      <button id="submit">Submit Answers</button>
      <button id="saveLocal">Save Locally</button>
    </div>
    <div id="result" class="hidden"></div>
    <div id="status" class="muted"></div>
  </main>

  <footer>
    <small>Configure the backend endpoint in <code>script.js</code> to collect submissions.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
